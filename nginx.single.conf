# Конфиг ЕДИНОГО контейнера: nginx отдаёт собранный фронт и проксирует /api
# на node, который слушает 127.0.0.1:3001 внутри этого же контейнера.
#
# Это шаблон, а не готовый конфиг: порт подставляется на старте (envsubst,
# см. docker-entrypoint.sh). Railway выдаёт порт переменной окружения, а nginx
# переменные окружения сам не читает — только то, что уже в файле.
#
# Подставляется ТОЛЬКО ${PORT}. Переменные nginx ($host, $remote_addr и
# прочие) написаны без фигурных скобок и в список подстановки не входят —
# иначе envsubst затёр бы их пустотой.
server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Как в прежнем nginx.conf: выгрузки и подписи приходят объёмными.
    client_max_body_size 20m;

    location /api/ {
        # Порт фиксированный и виден только изнутри контейнера: наружу
        # торчит один nginx.
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Без этого ограничитель частоты в API считал бы все запросы
        # пришедшими с 127.0.0.1 и складывал бы всех пользователей в одно
        # ведро. В server/src/index.ts стоит app.set('trust proxy', 1),
        # который читает именно этот заголовок.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # SPA: любой неизвестный путь отдаём index.html, маршрутизация внутри.
        try_files $uri $uri/ /index.html;
    }
}
